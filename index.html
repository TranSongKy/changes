<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lộ trình học</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Lộ trình học</h1>
      <p class="sub">Đồ thị · OOP · IELTS · HSK, đến khi tốt nghiệp</p>
    </div>
    <nav class="tabs" role="tablist">
      <button data-tab="today" class="active">Hôm nay</button>
      <button data-tab="exam30">30 ngày</button>
      <button data-tab="practice">Luyện tập</button>
      <button data-tab="ielts">IELTS</button>
      <button data-tab="hsk">HSK</button>
      <button data-tab="library">Tài liệu</button>
      <button data-tab="shelf">Thư viện</button>
      <button data-tab="log">Nhật ký</button>
      <button data-tab="settings">Cài đặt</button>
    </nav>
  </header>

  <main>
    <section id="tab-today" class="tab active"></section>
    <section id="tab-exam30" class="tab"></section>
    <section id="tab-practice" class="tab"></section>
    <section id="tab-ielts" class="tab"></section>
    <section id="tab-hsk" class="tab"></section>
    <section id="tab-library" class="tab"></section>
    <section id="tab-shelf" class="tab"></section>
    <section id="tab-log" class="tab"></section>
    <section id="tab-settings" class="tab"></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/library.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/materials.js"></script>
  <script src="js/graphalgo.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/ielts.js"></script>
  <script src="js/hskdeck.js"></script>
  <!-- Danh sách PDF trên máy bạn, tạo bằng npm run materials. Không có file này thì tab Thư viện chỉ hiện hướng dẫn. -->
  <script src="materials/library-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
